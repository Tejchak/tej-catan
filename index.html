<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>">
<title>Tej's Catan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Tej's Catan — colonist.io-style look: bright ocean ground, clean white
   panels, blue primary actions. Single committed theme, all colors explicit. */
:root{
  --sea:#1596CE; --sea-deep:#0E7FB8;
  --parch:#FFFFFF; --parch-2:#F1F5F9; --parch-3:#E2E8F0;
  --ink:#1E293B; --ink-dim:#64748B;
  --gold:#F2C12E; --gold-dark:#D9A62A;
  --accent:#2563EB; --accent-dark:#1D4ED8; --accent-lt:#EFF6FF;
  --good:#16A34A; --bad:#DC2626;
  --line:#CBD5E1;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--sea);
  background-image:radial-gradient(1100px 500px at 20% -10%, #35B5E5 0%, transparent 60%),
                   radial-gradient(900px 500px at 90% 110%, #2FAEDF 0%, transparent 55%);
  color:var(--ink);
  font-family:"Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
  font-size:16px; line-height:1.45;
  min-height:100vh;
  padding-inline:16px; padding-block:0;
}
h1,h2,h3{font-family:"Marcellus", Georgia, serif; font-weight:400; margin:0 0 .5em; text-wrap:balance}
h1{font-size:2.6rem; letter-spacing:.02em}
h2{font-size:1.35rem} h3{font-size:1.1rem}
a{color:var(--gold)}
button{font:inherit; cursor:pointer}
input,select{
  font:inherit; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px;
  background:#F8FAFC; color:var(--ink); width:100%;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
[hidden]{display:none!important}
small{font-size:.82em}

.card{background:var(--parch); border:1px solid var(--line); border-radius:14px;
  box-shadow:0 6px 24px rgba(7,55,82,.25)}
.pad{padding:16px 18px}
.dim{color:var(--ink-dim)}
.warn{color:#92400E; background:#FEF3C7; border:1px solid #FCD34D; border-radius:8px; padding:8px 10px; font-size:.92em}

.btn{
  background:var(--parch-2); color:var(--ink); border:1.5px solid var(--line);
  border-radius:9px; padding:8px 14px; font-weight:500; margin:3px 4px 3px 0;
  transition:transform .08s ease, background .12s ease;
}
.btn:hover:not(:disabled){background:var(--parch-3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45; cursor:default}
.btn.primary{background:var(--accent); border-color:var(--accent-dark); color:#fff; font-weight:700}
.btn.primary:hover:not(:disabled){background:#3B82F6}
.btn.danger{background:#FEE2E2; border-color:#FCA5A5; color:#991B1B}
.btn.active{background:var(--accent); border-color:var(--accent-dark); color:#fff; font-weight:700}
.btn.big{font-size:1.15rem; padding:12px 22px}
.btn.small{padding:3px 10px; font-size:.88em}
.btn.close{float:right; padding:4px 10px}

/* ---- home ---- */
#home{max-width:980px; margin:0 auto; padding-block:36px}
.hero{text-align:center; color:var(--parch); margin-bottom:26px}
.hero h1{color:var(--parch); font-size:3rem; text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero .tag{color:#E5F6FF; font-size:1.12rem; font-style:italic; margin:0}
.home-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media (max-width:760px){.home-grid{grid-template-columns:1fr}}
.fld{display:block; margin:0 0 14px; font-weight:700}
.fld input,.fld select{margin-top:4px; font-weight:400}
.radio{display:flex; gap:10px; align-items:flex-start; font-weight:400; margin:8px 0; padding:9px 10px;
  border:1.5px solid var(--line); border-radius:10px; background:#F8FAFC}
.radio:has(input:checked){border-color:var(--accent); background:var(--accent-lt); box-shadow:0 0 0 1px var(--accent)}
.radio input{width:auto; margin-top:4px}
.gamerow{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%;
  text-align:left; background:#F8FAFC; border:1.5px solid var(--line); border-radius:10px;
  padding:10px 12px; margin:0 0 8px; color:var(--ink)}
.gamerow:hover{background:var(--parch-2)}
.gamerow span{color:var(--ink-dim); font-size:.9em}
.joinrow{display:flex; gap:8px; margin-top:4px}
.joinrow input{max-width:120px}
.foot{text-align:center; color:#DCF2FC; margin-top:26px; font-size:.92em}

/* ---- game layout ---- */
#game{display:flex; flex-direction:column; min-height:100vh; max-width:1500px; margin:0 auto}
#topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding-block:10px; color:var(--parch);
}
.tb-left,.tb-mid,.tb-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.logo{font-family:"Marcellus",serif; font-size:1.3rem; color:var(--parch); text-decoration:none}
.gname{font-style:italic; color:#E5F6FF}
.chip{background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.45);
  border-radius:999px; padding:4px 12px; font-size:.88em}
.chip:hover{background:rgba(255,255,255,.28)}
.phase{font-weight:700; color:#FFE082}
.dice{display:inline-flex; align-items:center; gap:2px; background:rgba(0,0,0,.25); border-radius:8px; padding:2px 10px}
.d6{font-size:1.7rem; line-height:1; color:var(--parch)}
.dice b{margin-left:6px; color:var(--gold); font-size:1.1rem}

#main{display:flex; gap:16px; align-items:flex-start; padding-bottom:20px; flex:1}
#boardwrap{flex:1 1 60%; min-width:0; position:sticky; top:10px}
#board{width:100%; max-height:84vh; display:block}
.loading{color:#fff; padding:60px 20px; text-align:center; font-size:1.1rem}
#side{flex:0 1 400px; min-width:300px; display:flex; flex-direction:column; gap:12px}
@media (max-width:900px){
  #main{flex-direction:column}
  #boardwrap{position:static; width:100%}
  #side{width:100%; flex:1 1 auto; min-width:0}
}

/* board svg bits */
.hexemoji{font-size:20px; text-anchor:middle}
.tok{font-family:"Marcellus",serif; font-size:16px; font-weight:700; text-anchor:middle; fill:#3F3422}
.tok.hot{fill:#DC2626; font-size:18px}
.bld{stroke:#1d150c; stroke-width:1.5}
.legalvert{fill:rgba(255,255,255,.75); stroke:#2B1D08; stroke-width:1.5; cursor:pointer}
.legaledge{stroke:rgba(255,255,255,.65); stroke-width:10; stroke-linecap:round; cursor:pointer}
@media (prefers-reduced-motion: no-preference){
  .legalvert,.legaledge{animation:pulse 1.2s ease-in-out infinite alternate}
  @keyframes pulse{from{opacity:.55}to{opacity:1}}
}
.legalvert:hover{fill:#FFD97A}
.legaledge:hover{stroke:#FFD97A}
.hexbtn{cursor:pointer}
.glowhex{stroke:#FFD97A!important; stroke-width:3.5!important}
.port line{stroke:#EAF6FC; stroke-width:2.5; stroke-dasharray:3 3}
.port circle{fill:#FFFFFF; stroke:#94A3B8}
.port text{font-size:10.5px; text-anchor:middle; fill:#334155; font-weight:700}

/* players */
.prow{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--parch-3); flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow.turn{background:var(--accent-lt); box-shadow:inset 3px 0 0 var(--accent)}
.pdot{width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid rgba(0,0,0,.3); flex:none}
.pname{font-weight:700; flex:1 1 auto; min-width:70px}
.pstats{display:flex; gap:8px; flex-wrap:wrap; font-variant-numeric:tabular-nums; font-size:.93em}
.badge{background:var(--gold); color:#2B1D08; border-radius:999px; padding:0 8px; font-weight:700}
.badge.warnb{background:var(--bad); color:#fff}

/* actions / context */
.actbar{display:flex; flex-direction:column; gap:6px}
.buildrow,.traderow{display:flex; flex-wrap:wrap; gap:0 4px}
.traderow{flex-direction:column}
details{border:1px solid var(--parch-3); border-radius:10px; padding:6px 10px; margin:4px 0; background:#F1F5F9}
summary{cursor:pointer; font-weight:700}
.bankpick{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:8px 0}
.chipbtn{background:#F8FAFC; border:1.5px solid var(--line); border-radius:8px; padding:4px 9px}
.chipbtn:disabled{opacity:.4; cursor:default}
.chipbtn.sel{background:#DBEAFE; border-color:var(--accent); font-weight:700}
.qty{display:inline-flex; align-items:center; gap:4px; background:#F8FAFC; border:1px solid var(--parch-3);
  border-radius:8px; padding:2px 4px; font-variant-numeric:tabular-nums}
.qty .chipbtn{padding:1px 8px; border:none; background:var(--parch-2)}
.urgent{box-shadow:0 0 0 2.5px var(--accent), 0 6px 24px rgba(0,0,0,.25)}

/* hand */
.handrow{display:flex; flex-wrap:wrap; gap:8px}
.rescard{background:#F8FAFC; border:1.5px solid var(--line); border-radius:10px; padding:6px 12px;
  font-size:1.25rem; display:inline-flex; align-items:center; gap:4px}
.rescard b{font-size:.85rem}
.devlist{margin-top:10px; display:flex; flex-direction:column; gap:6px}
.devcard{display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#F1F5F9; border:1px solid var(--parch-3); border-radius:10px; padding:7px 10px}
.devcard small{display:block; color:var(--ink-dim)}

/* feed */
.tabrow{display:flex; gap:6px}
.tab{background:transparent; border:none; color:#E5F6FF; padding:6px 12px; border-radius:8px 8px 0 0; font-weight:700}
.tab.sel{background:var(--parch); color:var(--ink)}
#feed{background:var(--parch); border:1px solid var(--line); border-radius:0 12px 12px 12px;
  max-height:230px; min-height:90px; overflow-y:auto; padding:8px 10px}
.logline{padding:2px 0; font-size:.93em; display:flex; gap:7px; align-items:baseline}
.logline span{flex:none}
.chatline{display:block}
#chatbar{display:flex; gap:8px; margin-top:2px}
#chatbar input{flex:1}

/* lobby in-game */
.lobbybox{max-width:540px; margin:30px auto}
.seats{display:flex; flex-direction:column; gap:6px; margin:14px 0}
.seat{display:flex; align-items:center; gap:10px; background:#F8FAFC; border:1.5px solid var(--line);
  border-radius:10px; padding:9px 12px; font-weight:700}
.seat.empty{color:var(--ink-dim); font-weight:400; font-style:italic; border-style:dashed; background:transparent}
.joinblock{display:flex; gap:8px; margin:10px 0}
.hostrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

/* overlay */
#overlay{position:fixed; inset:0; background:rgba(3,40,60,.65); display:flex; align-items:flex-start;
  justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50}
.sheet{max-width:640px; width:100%}

/* turn timer */
.timer{background:rgba(0,0,0,.28); color:#fff; border-radius:999px; padding:4px 14px;
  font-variant-numeric:tabular-nums; font-weight:700; font-size:1rem}
.timer.low{background:var(--bad)}
@media (prefers-reduced-motion: no-preference){
  .timer.low{animation:tblink .8s steps(2) infinite}
  @keyframes tblink{to{opacity:.55}}
}

/* dice roll animation */
#diceanim{position:fixed; top:22%; left:50%; transform:translateX(-50%);
  display:flex; gap:16px; z-index:70; pointer-events:none}
.bigdie{font-size:92px; line-height:1; color:#1E293B; background:#fff;
  border-radius:18px; padding:2px 8px; box-shadow:0 14px 44px rgba(0,0,0,.45)}

/* toast */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60;
  background:#1E293B; color:var(--parch); padding:10px 18px; border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.5); max-width:min(520px,90vw); text-align:center}
</style>
</head>
<body>

<div id="home" hidden></div>
<div id="game" hidden>
  <header id="topbar"></header>
  <div id="main">
    <div id="boardwrap"></div>
    <aside id="side">
      <div id="players"></div>
      <div id="actions"></div>
      <div id="context"></div>
      <div id="hand"></div>
      <div id="tabs"></div>
      <div id="feed"></div>
      <div id="chatbar">
        <input id="chatin" maxlength="200" placeholder="Table talk…" aria-label="Chat message">
        <button id="chatsend" class="btn">Send</button>
      </div>
    </aside>
  </div>
</div>
<div id="overlay" hidden></div>
<div id="diceanim" hidden><span class="bigdie">⚅</span><span class="bigdie">⚅</span></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script src="core.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
